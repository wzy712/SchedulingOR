constraints:
  hard:
  - type: one_shift_per_day
    max_per_day: 2
  - type: rest_between_shifts
    min_hours: 1
  - type: max_consecutive_work_days
    days: 5
  - type: forbid_transition
    from: s1
    to: s2
  - type: requirement
    shift: s1
    group: seniors
    min: 1
  - type: no_pair
    people:
    - T01
    - T05
    note: 两人有亲属关系，不宜同场
  soft:
  - type: coverage_shortfall
    weight: 1000
  - type: coverage_excess
    weight: 20
  - type: fairness
    metric: total_shifts
    aggregation: spread
    weight: 60
  - type: fairness
    metric: shift:s1
    aggregation: spread
    weight: 40
  - type: preference
    weight: 30
  - type: consecutive_work_preference
    preferred_max: 3
    weight: 15
solver:
  max_time_seconds: 30
  num_workers: 8
  strategy: lexicographic
assumptions:
- 每位教师一天最多监考两场，且两场之间至少间隔 1 小时（默认值，请确认）
- 每场考试需要 5~8 名监考，其中至少 1 名资深教师
- 已按「教师不监考自己任教科目的场次」生成回避记录
unresolved:
- 是否需要为行动不便的教师单独安排低楼层考场？

constraints:
  hard:
  - type: one_shift_per_day
    max_per_day: 1
  - type: rest_between_shifts
    min_hours: 12
  - type: max_consecutive_work_days
    days: 5
  - type: weekly_rest_days
    min: 2
  - type: hours_bounds
    period: week
    max: 40
  soft:
  - type: coverage_shortfall
    weight: 1000
  - type: coverage_excess
    weight: 50
  - type: fairness
    metric: weekend_shifts
    aggregation: spread
    weight: 200
  - type: fairness
    metric: total_shifts
    aggregation: spread
    weight: 80
  - type: fairness
    metric: shift:night
    aggregation: spread
    weight: 120
  - type: preference
    weight: 30
solver:
  max_time_seconds: 60
  num_workers: 8
  strategy: lexicographic
assumptions:
- 工作日只需 1 人白班值班，周末额外需要 1 人夜班值守（默认值，请确认）
- 每周至少休息 2 天，连续值班不超过 5 天
- 班次间最小休息 12 小时
- 只设每周工时上限 40 小时，不设下限（值班岗位有限，设下限会强制全员上班）
unresolved:
- 法定节假日是否按周末规则加倍值守？

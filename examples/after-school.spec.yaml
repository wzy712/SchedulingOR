  num_workers: 8
  strategy: lexicographic
assumptions:
- 每周一至周五开设，每天第七节与晚自习各一轮（默认值，请确认）
- 第七节辅导需要 2~3 名教师，晚自习需要 1~2 名
- 数学日与英语日交替，由对应科目教师承担
unresolved:
- 同一教师能否连排第七节与晚自习？当前允许但间隔需 ≥1 小时

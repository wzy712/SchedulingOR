[project]
name = "schedulingor"
version = "0.1.0"
description = "CLI scheduling/rostering agent built on DSH + Google OR-Tools CP-SAT"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "ortools>=9.15",
    "pydantic>=2.12",
    "pydantic-settings>=2.7",
    "omegaconf>=2.3",
    "typer>=0.16",
    "openpyxl>=3.1",
    "XlsxWriter>=3.2",
    "pandas>=2.2",
    "PyYAML>=6.0",
    "mcp>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "mypy>=1.13",
]
# Optional: needed only if you run the CP-SAT primer's test helpers.
test-helpers = ["cpsat-utils>=0.0.6"]

[project.scripts]
sched = "scheduling_or.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scheduling_or"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/002/003 flag Chinese punctuation (，、（）「」) as "ambiguous unicode".
# E501 flags long Chinese string literals, which cannot be wrapped without losing
# the sentence. This project is written in Chinese on purpose, so both are noise.
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.uv]
# Install the project itself into the venv. Without this, `uv run <anything>`
# re-syncs the environment from this file, does not see `schedulingor` as a
# dependency of itself, and silently UNINSTALLS the editable install -- which
# breaks the `sched` console script with ModuleNotFoundError.
package = true
